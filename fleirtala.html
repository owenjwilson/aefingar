// Only use words where all six plural forms have been filled in
const words = allWords.filter(w =>
  w.nef_an && w.nef_med && w.tho_an && w.tho_med && w.thgf_an && w.thgf_med);

// Shuffle
for (let i = words.length - 1; i > 0; i--) {
  const j = Math.floor(Math.random() * (i + 1));
  [words[i], words[j]] = [words[j], words[i]];
}

let idx = 0;

const genderLabel = { m: "kk", f: "kvk", n: "hvk" };
const genderClass = { m: "kk", f: "kvk", n: "hvk" };

function render() {
  if (words.length === 0) {
    document.getElementById("app").innerHTML =
      "<p>Engin orð með fleirtölumyndum enn. Fylltu út gögnin í kóðanum.</p>";
    return;
  }

  const w = words[idx];

  const html = `
    <div class="card">
      <div class="word-header">
        <span class="word-main">${w.is}</span>
        <span class="gender-badge ${genderClass[w.gender]}">${genderLabel[w.gender]}</span>
      </div>
      <div class="word-en">${w.en}</div>

      <table>
        <thead>
          <tr>
            <th></th>
            <th>án greinis</th>
            <th>með greini</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>nefnifall</td>
            <td><input type="text" id="nef_an" autocomplete="off" autocorrect="off" spellcheck="false"></td>
            <td><input type="text" id="nef_med" autocomplete="off" autocorrect="off" spellcheck="false"></td>
          </tr>
          <tr>
            <td>þolfall</td>
            <td><input type="text" id="tho_an" autocomplete="off" autocorrect="off" spellcheck="false"></td>
            <td><input type="text" id="tho_med" autocomplete="off" autocorrect="off" spellcheck="false"></td>
          </tr>
          <tr>
            <td>þágufall</td>
            <td><input type="text" id="thgf_an" autocomplete="off" autocorrect="off" spellcheck="false"></td>
            <td><input type="text" id="thgf_med" autocomplete="off" autocorrect="off" spellcheck="false"></td>
          </tr>
        </tbody>
      </table>

      <div class="btn-row">
        <button class="btn-check" onclick="check()">Athuga svör</button>
        <button class="btn-show"  onclick="show()">Sýna svör</button>
        <button class="btn-nav"   onclick="prev()">← Til baka</button>
        <button class="btn-nav"   onclick="next()">Áfram →</button>
      </div>
    </div>
    <p class="counter">${idx + 1} / ${words.length}</p>
  `;

  document.getElementById("app").innerHTML = html;
  document.getElementById("nef_an").focus();
}

// Accepts several correct forms separated by " / "
function accepted(correct) {
  return correct.split("/").map(s => s.trim().toLowerCase());
}

function check() {
  const w = words[idx];
  const fields = [
    { id: "nef_an",  correct: w.nef_an  },
    { id: "nef_med", correct: w.nef_med },
    { id: "tho_an",  correct: w.tho_an  },
    { id: "tho_med", correct: w.tho_med },
    { id: "thgf_an",  correct: w.thgf_an  },
    { id: "thgf_med", correct: w.thgf_med }
  ];
  fields.forEach(({ id, correct }) => {
    const input = document.getElementById(id);
    const val = input.value.trim().toLowerCase();
    input.classList.remove("correct", "incorrect", "shown");
    if (accepted(correct).includes(val)) {
      input.classList.add("correct");
    } else if (val !== "") {
      input.classList.add("incorrect");
    }
  });
}

function show() {
  const w = words[idx];
  [["nef_an", w.nef_an], ["nef_med", w.nef_med], ["tho_an", w.tho_an], ["tho_med", w.tho_med],
   ["thgf_an", w.thgf_an], ["thgf_med", w.thgf_med]].forEach(([id, val]) => {
    const input = document.getElementById(id);
    input.value = val;
    input.classList.remove("correct", "incorrect");
    input.classList.add("shown");
  });
}

function next() { idx = (idx + 1) % words.length; render(); }
function prev() { idx = (idx - 1 + words.length) % words.length; render(); }

render();
